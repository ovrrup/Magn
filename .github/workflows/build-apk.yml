name: Build Magn APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Scaffold Platform Harness
        run: |
          flutter create . --platforms=android --org=com.ovrrup
          python3 -c "
          import re
          try:
              with open('android/app/build.gradle', 'r') as f:
                  content = f.read()
              content = re.sub(r'compileSdk(Version)?(\s*=?\s*).*', r'compileSdk = 36', content)
              with open('android/app/build.gradle', 'w') as f:
                  f.write(content)
          except Exception as e:
              print(f'Error updating android/app/build.gradle: {e}')

          with open('android/build.gradle', 'a') as f:
              f.write('\nsubprojects { subproject ->\n    subproject.pluginManager.withPlugin(\"com.android.library\") {\n        try { subproject.android.compileSdk = 36 } catch (Exception ignored) {}\n        try { subproject.android.compileSdkVersion 36 } catch (Exception ignored) {}\n    }\n    subproject.pluginManager.withPlugin(\"com.android.application\") {\n        try { subproject.android.compileSdk = 36 } catch (Exception ignored) {}\n        try { subproject.android.compileSdkVersion 36 } catch (Exception ignored) {}\n    }\n    subproject.afterEvaluate {\n        if (subproject.hasProperty(\"android\")) {\n            try { subproject.android.compileSdk = 36 } catch (Exception ignored) {}\n            try { subproject.android.compileSdkVersion 36 } catch (Exception ignored) {}\n        }\n    }\n}\n')
          "

      - name: Install Pub Dependencies
        run: |
          flutter pub get
          python3 -c "
          import os, re
          pub_cache = os.path.expanduser('~/.pub-cache')
          if os.path.exists(pub_cache):
              for root, _, files in os.walk(pub_cache):
                  for file in files:
                      if file == 'build.gradle':
                          path = os.path.join(root, file)
                          try:
                              with open(path, 'r', errors='ignore') as fp:
                                  data = fp.read()
                              new_data = re.sub(r'compileSdk(Version)?(\s*=?\s*)\d+', r'compileSdkVersion 36', data)
                              if new_data != data:
                                  with open(path, 'w', errors='ignore') as fp:
                                      fp.write(new_data)
                          except Exception:
                              pass
          "

      - name: Static Analysis
        run: flutter analyze

      - name: Run Automated Test Suite
        run: flutter test

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Stage Release Artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/magn-v1.0.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: magn-v1.0.0-release-apk
          path: dist/magn-v1.0.0-release.apk
          if-no-files-found: error
