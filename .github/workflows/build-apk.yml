name: Build Magn APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Scaffold Platform Harness
        run: |
          flutter create . --platforms=android --org=com.ovrrup
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle || true
          cat << 'EOF' >> android/build.gradle

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileSdkVersion 36
            }
        }
    }
    tasks.configureEach { task ->
        if (task.name.contains("AarMetadata")) {
            task.enabled = false
        }
    }
}
EOF

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze

      - name: Run Automated Test Suite
        run: flutter test

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Stage Release Artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/magn-v1.0.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: magn-v1.0.0-release-apk
          path: dist/magn-v1.0.0-release.apk
          if-no-files-found: error
